<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المشرف - إدارة رسائل XXX</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #121214; color: #ffffff; padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: auto; background: #1a1a1e; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #00e676; border-bottom: 2px solid #24242b; padding-bottom: 10px; font-size: 22px; }
        .msg-card { background: #24242b; padding: 15px; margin: 15px 0; border-radius: 10px; border-right: 5px solid #00e676; }
        .time { font-size: 11px; color: #848e9c; float: left; }
        .sender { font-weight: bold; color: #00e676; }
        .text { margin-top: 8px; font-size: 15px; }
        .btn-refresh { background: #24242b; color: #00e676; border: 1px solid #00e676; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 10px; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛠️ لوحة تحكم المشرف - الوارد</h1>
        <button class="btn-refresh" onclick="loadMessages()">🔄 تحديث الرسائل الواردة</button>
        
        <div id="messages-container">
            <p id="no-msg" style="color: #848e9c;">لا توجد رسائل واردة من الأصدقاء حالياً.</p>
        </div>
    </div>

    <script>
        function loadMessages() {
            fetch('/api/admin/messages')
                .then(res => res.json())
                .then(messages => {
                    const container = document.getElementById('messages-container');
                    if (messages.length === 0) {
                        container.innerHTML = '<p id="no-msg" style="color: #848e9c;">لا توجد رسائل واردة من الأصدقاء حالياً.</p>';
                        return;
                    }
                    container.innerHTML = '';
                    messages.forEach(msg => {
                        container.innerHTML += `
                            <div class="msg-card">
                                <span class="time">${msg.time}</span>
                                <span class="sender">👤 من: ${msg.username}</span>
                                <div class="text">${msg.message}</div>
                            </div>
                        `;
                    });
                });
        }
        // تحميل الرسائل تلقائياً عند فتح الصفحة
        loadMessages();
    </script>
</body>
</html>
