<link rel="manifest" href="/manifest.json">
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق XXX للمحاكاة</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #121214; color: #ffffff; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 450px; margin: 20px auto; background: #1a1a1e; padding: 25px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1 { color: #00e676; font-size: 26px; margin-bottom: 5px; }
        .status-box { background: #24242b; padding: 15px; margin: 15px 0; border-radius: 12px; border-right: 6px solid #00e676; text-align: right; }
        .balance-title { font-size: 14px; color: #aaaaaa; }
        .balance-value { font-size: 24px; font-weight: bold; color: #ffffff; margin-top: 5px; }
        .btn { background-color: #00e676; color: #000; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 15px; }
        .notice { font-size: 12px; color: #ff5252; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 تطبيق XXX الذكي</h1>
        <p>مرحباً بك في واجهة محاكاة التداول التجريبية</p>
        
        <div class="status-box">
            <div class="balance-title">الحساب التجريبي المتاح (Demo Balance)</div>
            <div id="balance" class="balance-value">جاري التحميل...</div>
        </div>

        <button class="btn" onclick="sendSupport()">📱 مراسلة الدعم الفني</button>
        
        <p class="notice">⚠️ تنبيه: هذا التطبيق مخصص لأغراض التعليم ومحاكاة البرمجة فقط، ولا يقبل أي إيداعات أو معاملات مالية حقيقية.</p>
    </div>

    <script>
        // جلب بيانات المستخدم التجريبي من السيرفر الخاص بك
        fetch('/api/user/data?username=user77')
            .then(res => res.json())
            .then(data => {
                document.getElementById('balance').innerText = `$${data.balance.toFixed(2)}`;
            })
            .catch(() => {
                document.getElementById('balance').innerText = '\$50.00';
            });

        function sendSupport() {
            alert('تم فتح نافذة المراسلة مع المشرف بنجاح.');
        }
    </script>
</body>
</html>
