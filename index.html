<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEXC Smart Trading</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0b0c;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 10px;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            background-color: #121214;
            border-radius: 24px;
            padding: 25px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid #1f1f23;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 {
            color: #f1c40f;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .price-card {
            background-color: #1c1c1e;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #2c2c2e;
        }
        .price-title {
            color: #8e8e93;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .price-value {
            color: #2ecc71;
            font-size: 22px;
            font-weight: bold;
        }
        .balance-table {
            background-color: #1c1c1e;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid #2c2c2e;
        }
        .balance-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #2c2c2e;
        }
        .balance-row:last-child {
            border-bottom: none;
        }
        .row-label {
            color: #aeaeaf;
            font-size: 15px;
        }
        .row-value {
            font-weight: bold;
            font-size: 16px;
        }
        .value-green { color: #2ecc71; }
        .value-gold { color: #f1c40f; }

        /* شبكة الأزرار */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .btn {
            border: none;
            padding: 15px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #ffffff;
        }
        .btn-deposit {
            background-color: #2ecc71;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.2);
        }
        .btn-deposit:active { transform: scale(0.98); }
        .btn-withdraw {
            background-color: #e74c3c;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.2);
        }

        /* النافذة المنبثقة البوب أب العائمة */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            padding: 0 20px;
        }
        .modal-box {
            background-color: #1c1c1e;
            width: 100%;
            max-width: 390px;
            padding: 25px;
            border-radius: 24px;
            border: 1px solid #2ecc71;
            text-align: center;
            position: relative;
            animation: slideUp 0.3s ease-out;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #8e8e93;
            font-size: 24px;
            cursor: pointer;
        }
        .wallet-box {
            background-color: #0b0b0c;
            color: #2ecc71;
            padding: 14px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 13px;
            word-break: break-all;
            margin: 10px 0 15px 0;
            border: 1px solid #2c2c2e;
            letter-spacing: 0.5px;
        }
        .input-field {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #3a3a3c;
            background-color: #0b0b0c;
            color: #ffffff;
            font-family: monospace;
            font-size: 13px;
            text-align: center;
            margin-top: 8px;
            margin-bottom: 15px;
            outline: none;
            transition: border 0.2s;
        }
        .input-field:focus {
            border-color: #2ecc71;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- الهيدر الرئيسي للمنصة -->
    <div class="header">
        <h1>MEXC Smart Trading 📊</h1>
    </div>

    <!-- عرض السعر المباشر المتصل بالسوق الحقيقي -->
    <div class="price-card">
        <div class="price-title">سعر عملة XLM / USDT الآن:</div>
        <div class="price-value" id="livePrice">جاري الاتصال بالسوق...</div>
    </div>

    <!-- جدول الأرصدة الفاخر للمستخدم -->
    <div class="balance-table">
        <div class="balance-row">
            <span class="row-label">رأس المال المتاح (USDT):</span>
            <span class="row-value value-gold" id="userBalance">50.00</span>
        </div>
        <div class="balance-row">
            <span class="row-label">المكافآت المقفلة (10%):</span>
            <span class="row-value">0.00</span>
        </div>
        <div class="balance-row">
            <span class="row-label">الأرباح المتوقعة (25%):</span>
            <span class="row-value value-green">0.00+</span>
        </div>
    </div>

    <!-- شبكة الأزرار التفاعلية المجهزة بالوظائف -->
    <div class="btn-grid">
        <button class="btn btn-deposit" onclick="openDepositModal()">📥 إيداع فوري</button>
        <button class="btn btn-withdraw" onclick="alert('سيتم فتح نظام السحب الحقيقي قريباً')">📤 طلب سحب</button>
    </div>
</div>

<!-- ========================================== -->
<!-- بوابة الإيداع العائمة المطورة (Modal Popup) -->
<!-- ========================================== -->
<div id="depositModal" class="modal-overlay">
    <div class="modal-box">
        <span class="close-btn" onclick="closeDepositModal()">&times;</span>
        <div style="font-size: 30px; margin-bottom: 10px;">💳</div>
        <h3 style="font-size: 18px; margin-bottom: 8px;">بوابة الإيداع والربط</h3>
        <p style="color: #aeaeaf; font-size: 13px; line-height: 1.4;">يرجى تحويل العملات الرقمية عبر شبكة:<br><strong style="color: #2ecc71;">TRON (TRC-20)</strong></p>
        
        <!-- محفظة المنصة الخاصة بك ليقوم الصديق بنسخها والإرسال إليها -->
        <div style="text-align: right; margin-top: 15px;"><label style="color: #8e8e93; font-size: 11px; font-weight: bold; margin-right: 5px;">عنوان محفظة الاستلام (المنصة):</label></div>
        <div id="walletAddress" class="wallet-box">TA1vsgrJEFy3YM6rkQWBppnZemFE6c9pBN</div>
        <button id="copyBtn" onclick="copyWalletAddress()" style="background-color: #222; color: #2ecc71; border: 1px solid #2ecc71; padding: 10px; border-radius: 10px; width: 100%; cursor: pointer; font-size: 13px; font-weight: bold; margin-bottom: 15px;">📋 نسخ عنوان المنصة</button>
        
        <hr style="border: 0; border-top: 1px solid #2c2c2e; margin-bottom: 15px;">

        <!-- الحقل الجديد: ليقوم المشترك بوضع عنوان محفظته للربط والتوثيق -->
        <div style="text-align: right;"><label style="color: #ffffff; font-size: 13px; font-weight: bold; margin-right: 5px;">🔗 اربط محفظتك الشخصية (TRC-20):</label></div>
        <input type="text" id="userWalletInput" placeholder="أدخل أو الصق عنوان محفظتك هنا..." class="input-field">
        
        <button id="saveWalletBtn" onclick="saveUserWallet()" style="background-color: #2ecc71; color: #fff; border: none; padding: 13px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; font-size: 15px; box-shadow: 0 4px 12px rgba(46, 204, 113, 0.2);">🔒 حفظ وربط المحفظة</button>
    </div>
</div>

<script>
    // فتح النافذة المنبثقة
    function openDepositModal() {
        document.getElementById("depositModal").style.display = "flex";
        
        // إذا كان المشترك قد حفظ محفظته مسبقاً، نقوم بعرضها تلقائياً داخل الحقل
        const savedWallet = localStorage.getItem("saved_user_wallet");
        if (savedWallet) {
            document.getElementById("userWalletInput").value = savedWallet;
        }
    }
    
    // إغلاق النافذة
    function closeDepositModal() {
        document.getElementById("depositModal").style.display = "none";
    }
    
    // إغلاق النافذة عند الضغط على المساحة الرمادية الفارغة بالخارج
    window.onclick = function(event) {
        var modal = document.getElementById("depositModal");
        if (event.target == modal) {
            modal.style.display = "none";
        }
    }

    // نسخ محفظة المنصة بصورة احترافية متفاعلة دون الخروج من الصفحة
    function copyWalletAddress() {
        const addressText = document.getElementById("walletAddress").innerText.trim();
        const btn = document.getElementById("copyBtn");
        
        navigator.clipboard.writeText(addressText).then(() => {
            showSuccess(btn, "✅ تم نسخ عنوان المنصة!");
        }).catch(err => {
            const el = document.createElement('textarea');
            el.value = addressText;
