<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الصفقات التجريبية</title>
    <style>
        /* تهيئة الأبعاد لملء شاشة الهاتف بالكامل */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #121212; /* خلفية داكنة تناسب التطبيقات */
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* الحاوية الرئيسية للتطبيق */
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            justify-content: center;
        }

        .card {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }

        h2 { 
            margin-top: 0; 
            color: #00e676; 
            font-size: 22px;
        }

        p { color: #aaaaaa; font-size: 14px; }

        label {
            display: block;
            text-align: right;
            margin-top: 15px;
            font-weight: bold;
            color: #ccc;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 6px;
            border: 1px solid #333;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #2a2a2a;
            color: white;
        }

        select:focus, input:focus {
            border-color: #00e676;
            outline: none;
        }

        button {
            background-color: #00e676;
            color: #000;
            border: none;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background-color: #00b359; }

        /* صندوق الإيداع المميز */
        .deposit-box {
            background-color: #2e2712;
            border: 1px solid #ffd54f;
            color: #ffd54f;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 13px;
            text-align: right;
            word-break: break-all;
        }

        .deposit-box strong { color: #fff; display: block; margin-bottom: 5px; }

        .status-box {
            margin-top: 20px;
            padding: 12px;
            background: #222;
            border-radius: 6px;
            font-size: 14px;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="card">
            <h2>إرسال معاملة جديدة</h2>
            <p>شارك تفاصيل صفقاتك وعملياتك التجريبية مع أصدقائك</p>
            
            <label for="userId">اسم المستخدم الخاص بك:</label>
            <input type="text" id="userId" placeholder="اكتب اسمك هنا">

            <label for="type">نوع المعاملة:</label>
            <select id="type" onchange="toggleDepositInfo()">
                <option value="deposit">طلب إيداع رصيد</option>
                <option value="withdraw">طلب سحب رصيد</option>
            </select>

            <!-- قسم عرض عنوان المحفظة للتحويل -->
            <div class="deposit-box" id="depositSection">
                <strong>⚠️ عنوان محفظة الإيداع (TRC-20):</strong>
                قم بالتحويل للعنوان التالي أولاً، ثم أكمل النموذج أدناه:
                <br><code style="font-size: 14px; color: #fff; background: #000; padding: 2px 5px; display: inline-block; margin-top: 5px; border-radius: 4px;">TA1vsgrJEFy3YM6rkQWBppnZemFE6c9pBN</code>
            </div>

            <label for="amount">المبلغ ($):</label>
            <input type="number" id="amount" placeholder="أدخل القيمة بالدولار">

            <button onclick="sendTransaction()">تأكيد وإرسال للمشرف</button>

            <div class="status-box" id="statusMessage">جاهز لإرسال البيانات...</div>
        </div>
    </div>

    <script>
        function toggleDepositInfo() {
            const type = document.getElementById('type').value;
            const depositSection = document.getElementById('depositSection');
            depositSection.style.display = (type === 'deposit') ? 'block' : 'none';
        }

        function sendTransaction() {
            const userId = document.getElementById('userId').value;
            const type = document.getElementById('type').value;
            const amount = document.getElementById('amount').value;
            const statusMessage = document.getElementById('statusMessage');

            if (!userId || !amount) {
                statusMessage.innerText = "⚠️ يرجى كتابة الاسم والمبلغ أولاً!";
                statusMessage.style.color = "#ff5252";
                return;
            }

            statusMessage.innerText = "⏳ جاري إرسال الطلب...";
            statusMessage.style.color = "#ffd54f";

            fetch('/api/submit-request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: userId, type: type, amount: amount })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    statusMessage.innerText = "✅ " + data.message;
                    statusMessage.style.color = "#00e676";
                } else {
                    statusMessage.innerText = "❌ فشل في إرسال البيانات.";
                    statusMessage.style.color = "#ff5252";
                }
            })
            .catch(err => {
                statusMessage.innerText = "❌ خطأ في الاتصال بالسيرفر.";
                statusMessage.style.color = "#ff5252";
            });
        }
    </script>
</body>
</html>
