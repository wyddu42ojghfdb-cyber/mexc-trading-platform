<!-- نافذة الشات المطور (مستخدم + بوت + مشرف) -->
<div id="chat-box" style="position: fixed; bottom: 20px; left: 20px; width: 320px; background: #181a20; border: 1px solid #2b3139; border-radius: 8px; overflow: hidden; text-align: right; font-family: sans-serif; box-shadow: 0px 4px 10px rgba(0,0,0,0.5); z-index: 9999;">
    <div style="background: #02c076; color: white; padding: 10px; font-weight: bold; display: flex; justify-content: space-between;">
        <span>💬 الدعم الفني والخدمة الآلية</span>
        <span id="chat-status" style="font-size: 11px; background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 10px;">آلي 🤖</span>
    </div>
    <div id="chat-messages" style="height: 220px; padding: 10px; overflow-y: auto; font-size: 14px; display: flex; flex-direction: column; gap: 8px; background: #0b0e11;">
        <div style="background: #2b3139; padding: 6px 10px; border-radius: 4px; align-self: flex-start; max-width: 80%;">مرحباً بك! أنا المجيب الآلي، كيف يمكنني مساعدتك؟ (اكتب 'مشرف' للتحدث مع الدعم البشري).</div>
    </div>
    <div style="display: flex; border-top: 1px solid #2b3139;">
        <input type="text" id="chat-input" placeholder="اكتب رسالتك هنا..." style="width: 75%; border: none; padding: 10px; background: #181a20; color: white; text-align: right;">
        <button onclick="sendChatMessage()" style="width: 25%; background: #02c076; color: white; border: none; cursor: pointer; font-weight: bold;">إرسال</button>
    </div>
</div>

<script>
    // جلب الرسائل الجديدة القادمة من المشرف كل ثانيتين
    setInterval(fetchAdminMessages, 2000);

    function sendChatMessage() {
        const input = document.getElementById('chat-input');
        const messagesContainer = document.getElementById('chat-messages');
        const userText = input.value.trim();

        if (userText === '') return;

        // إضافة رسالة المستخدم للشاشة
        appendMessage(userText, 'user');
        input.value = '';

        // إرسال الرسالة للسيرفر
        fetch('/api/chat/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sender: 'user', message: userText })
        })
        .then(res => res.json())
        .then(data => {
            // إذا قام البوت بالرد، اعرض رد البوت
            if (data.botReply) {
                setTimeout(() => {
                    appendMessage(data.botReply, 'bot');
                }, 600);
            }
            if (data.status === 'forwarded') {
                document.getElementById('chat-status').innerText = "مشرف 👨‍💻";
            }
        });
    }

    function fetchAdminMessages() {
        fetch('/api/chat/get-updates?role=user')
        .then(res => res.json())
        .then(messages => {
            messages.forEach(msg => {
                appendMessage(msg.text, 'admin');
            });
        });
    }

    function appendMessage(text, side) {
        const messagesContainer = document.getElementById('chat-messages');
        const msgHtml = document.createElement('div');
        
        if (side === 'user') {
            msgHtml.style.cssText = "background: #02c076; color: white; padding: 6px 10px; border-radius: 4px; align-self: flex-end; max-width: 80%;";
        } else if (side === 'bot') {
            msgHtml.style.cssText = "background: #2b3139; color: #a1a8b5; padding: 6px 10px; border-radius: 4px; align-self: flex-start; max-width: 80%; font-style: italic;";
        } else { // admin
            msgHtml.style.cssText = "background: #1f5eff; color: white; padding: 6px 10px; border-radius: 4px; align-self: flex-start; max-width: 80%; font-weight: bold;";
            document.getElementById('chat-status').innerText = "مشرف 👨‍💻";
        }
        
        msgHtml.innerText = text;
        messagesContainer.appendChild(msgHtml);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
</script>
