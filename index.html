<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة مشاركة الصفقات والعمليات</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 500px; background: white; padding: 20px; margin: 20px auto; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .status-box { margin-top: 20px; padding: 10px; background: #e9ecef; border-radius: 5px; font-weight: bold; }
        
        /* صندوق عرض معلومات الإيداع */
        .deposit-info { 
            background-color: #fff3cd; 
            border: 1px solid #ffeeba; 
            color: #856404; 
            padding: 15px; 
            border-radius: 5px; 
            margin-bottom: 20px; 
            font-size: 14px;
            word-break: break-all; /* تضمن عدم خروج العنوان الطويل عن الإطار */
        }
        .deposit-info strong { display: block; margin-bottom: 5px; color: #533f03; }
    </style>
</head>
<body>

    <div class="container">
        <h2>مشاركة صفقة جديدة</h2>
        
        <!-- 💡 قسم معلومات الإيداع يظهر هنا بوضوح للمستخدم قبل الإرسال -->
        <div class="deposit-info" id="depositSection" style="display: block;">
            <strong>⚠️ معلومات الإيداع (شبكة TRC-20):</strong>
            يرجى تحويل المبلغ إلى المحفظة التالية أولاً، ثم قم بملء النموذج في الأسفل لتأكيد المعاملة:
            <br><code style="font-weight: bold; font-size: 15px;">TA1vsgrJEFy3YM6rkQWBppnZemFE6c9pBN</code>
        </div>
        
        <p>أدخل تفاصيل الصفقة لإرسالها للمشرف للمراجعة</p>
        
        <label for="userId">اسم المستخدم / المعرّف:</label>
        <input type="text" id="userId" placeholder="مثال: أحمد">

        <label for="type" onchange="toggleDepositInfo()">نوع العملية:</label>
        <select id="type" onchange="toggleDepositInfo()">
            <option value="deposit">طلب إيداع رصيد</option>
            <option value="withdraw">طلب سحب رصيد</option>
        </select>

        <label for="amount">المبلغ ($):</label>
        <input type="number" id="amount" placeholder="أدخل المبلغ هنا" min="1">

        <button onclick="sendTransaction()">إرسال العملية للمشرف</button>

        <div class="status-box" id="statusMessage">في انتظار إرسال بيانات...</div>
    </div>

    <script>
        // دالة لإخفاء أو إظهار عنوان الإيداع بناءً على خيار المستخدم
        function toggleDepositInfo() {
            const type = document.getElementById('type').value;
            const depositSection = document.getElementById('depositSection');
            if (type === 'deposit') {
                depositSection.style.display = 'block';
            } else {
                depositSection.style.display = 'none';
            }
        }

        function sendTransaction() {
            const userId = document.getElementById('userId').value;
            const type = document.getElementById('type').value;
            const amount = document.getElementById('amount').value;
            const statusMessage = document.getElementById('statusMessage');

            if (!userId || !amount) {
                statusMessage.innerText = "⚠️ يرجى ملء جميع الحقول أولاً!";
                statusMessage.style.color = "red";
                return;
            }

            // إرسال البيانات إلى السيرفر الوسيط server.js
            fetch('/api/submit-request', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    userId: userId,
                    type: type,
                    amount: amount
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    statusMessage.innerText = "✅ " + data.message;
                    statusMessage.style.color = "green";
                } else {
                    statusMessage.innerText = "❌ فشل إرسال الطلب.";
                    statusMessage.style.color = "red";
                }
            })
            .catch(error => {
                console.error('Error:', error);
                statusMessage.innerText = "❌ حدث خطأ أثناء الاتصال بالسيرفر.";
                statusMessage.style.color = "red";
            });
        }
    </script>
</body>
</html>
